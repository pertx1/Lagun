# Cron del check-in de fin de día (gratis en GitHub Actions).
# Llama cada hora a /api/cron/checkin; la ruta solo avisa a quien tenga
# activado el check-in + notificaciones y sea su hora local.
#
# Configura en el repo (Settings → Secrets and variables → Actions):
#   LAGUN_URL    → URL pública de la app, p. ej. https://lagun.vercel.app
#   CRON_SECRET  → el mismo valor que en las variables de entorno de Vercel
name: Check-in cron

on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al cron de check-in
        env:
          LAGUN_URL: ${{ secrets.LAGUN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$LAGUN_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secrets LAGUN_URL o CRON_SECRET; no se envía nada."
            exit 0
          fi
          curl --fail-with-body -sS -m 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$LAGUN_URL/api/cron/checkin"
